# parameters
nc: 9  # number of classes
depth_multiple: 1.00  # model depth multiple
width_multiple: 1.00  # layer channel multiple

# anchors
anchors:
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  # Two Stream
  [[-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],  # 9

   # IR Stream (注意：这里用 -4 引用 input_ir，在 yolo_test.py 里会被强制修正为 layer 10，很安全)
   [-4, 1, Conv, [64, 6, 2, 2]],  # 10-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 11-P2/4
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],  # 13-P3/8
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],  # 15-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 17-P5/32
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],  # 19

    ######### Fusion Block (TransFusion) #############
    # 修正：补全参数列表，确保 diffusion 开关能被传入
    # [d_model, vert, horz, h, block_exp, n_layer, embd_pdrop, attn_pdrop, resid_pdrop, use_diffusion]

    # 20: P3 Fusion (关闭扩散)
    [ [ 4,14 ], 1, TransformerFusionBlock, [ 256, 20, 20, 8, 4, 1, 0.1, 0.1, 0.1, False ] ],

    # 21: P4 Fusion (关闭扩散)
    [ [ 6,16 ], 1, TransformerFusionBlock, [ 512, 16, 16, 8, 4, 1, 0.1, 0.1, 0.1, False ] ],

    # 22: P5 Fusion (🔥开启扩散 - True)
    [ [ 9,19 ], 1, TransformerFusionBlock, [ 1024, 10, 10, 8, 4, 1, 0.1, 0.1, 0.1, True ] ],
  ]


# YOLOv5 head
head:
  [[-1, 1, Conv, [512, 1, 1]],          # 23 (P5 融合后特征 20x20)
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 24 (Upsample -> 40x40)
   [[-1,21], 1, Concat, [1]],           # 25 (Concat P4 Fusion: 40x40 + 40x40. OK)
   [-1, 3, C3, [512, False]],           # 26

   [-1, 1, Conv, [256, 1, 1]],          # 27 (P4 特征 40x40)
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 28 (Upsample -> 80x80)
   [[-1,20], 1, Concat, [1]],           # 29 (Concat P3 Fusion: 80x80 + 80x80. OK)
   [-1, 3, C3, [256, False]],           # 30 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],          # 31 (Downsample -> 40x40)
   [[-1,27], 1, Concat, [1]],           # 32 (Concat P4 Head: 40x40 + 40x40. OK)
   [-1, 3, C3, [512, False]],           # 33 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],          # 34 (Downsample -> 20x20)

   # 🛠️【关键修复】这里必须是 23 (P5 Conv)，绝对不能是 21！
   # 23 层是 20x20，21 层是 40x40。
   [[-1,23], 1, Concat, [1]],           # 35 (Concat P5 Head: 20x20 + 20x20. FIXED!)

   [-1, 3, C3, [1024, False]],          # 36 (P5/32-large)

   [[30, 33, 36], 1, Detect, [nc, anchors]],    # Detect(P3, P4, P5)
  ]
