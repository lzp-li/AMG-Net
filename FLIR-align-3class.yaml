# COCO 2017 dataset http://cocodataset.org - first 128 training images
# Train command: python train.py --data coco128.yaml
# Default dataset location is next to YOLOv5:
#   /parent_folder
#     /coco128
#     /yolov5


# download command/URL (optional)
# download: https://github.com/ultralytics/yolov5/releases/download/v1.0/coco128.zip

# train and val data as 1) directory: path/images/, 2) file: path/images.txt, or 3) list: [path1/images/, path2/images/]
# FLIR-align-3class.yaml (修正版)

# FLIR-align-3class.yaml (最终修正版)

# 1. 数据集根目录 (保持不变)
path: ../FLIR-align-3class

# 2. 训练集 (Train) - 使用绝对路径！
train_rgb: images/train_rgb
train_ir: /images/train_ir

# 3. 验证集 (Val) - 使用绝对路径！
val_rgb: images/val_rgb
val_ir: images/val_ir

# 4. 测试集 (Test) - 使用绝对路径！
# 注意：即使代码中不使用这两个路径，也应该保持完整性。
test_rgb: images/test_rgb
test_ir: images/test_ir

# 类别设置 (保持不变)
nc: 3
names: ['person', 'car', 'bicycle']

model_flags:
  use_feature_align: False   # FLIR 视差大，禁用物理对齐
  use_illumination_gate: False # FLIR 主要是红外，禁用光照门控
  deterministic: True        # FLIR 保持默认